[package]
name = "billionverify"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Official Rust client for the BillionVerify email verification API"
license = "MIT"
repository = "https://github.com/BillionVerify/billionverify-rust"
homepage = "https://billionverify.com"
documentation = "https://docs.rs/billionverify"
readme = "README.md"
keywords = ["email", "verification", "email-verification", "billionverify", "api-client"]
categories = ["api-bindings", "email"]
exclude = [".github/", ".gitignore"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "fs"] }
hmac = "0.13"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
wiremock = "0.6"
